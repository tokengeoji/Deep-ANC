# Stage-2/3 파인튜닝 — 실측 녹음 혼합 + (선택) closed-loop
# 실행: .venv/bin/python scripts/train/train.py --config configs/train_finetune.yaml
# digital-ref 는 configs/data_sim.yaml 의 값을 그대로 쓴다 — 2026-08-05 플랜트 복구 이후
# 그 값은 **116** 이다 (S 1462 + handoff 256 − P 1602; 독립 캡처 9건 115~117, 중앙 116).
# (이 줄은 "+109 를 쓰며 배포 runtime 도 109 로 맞춘다"였다. 109 는 실측 P/S 이전의
#  추정값이고, 지금은 배포 ONNX 만이 109 에 묶여 있다 — configs/runtime_tiny.yaml 참조.)
# 기존 lead=0/무효 objective checkpoint는 init/resume에 사용하지 않는다.
#
# ⚠ init 후보 checkpoint(runs/pretrain_{base,tiny}_corrected/ckpt/best.pt)는
#   cfg.trusted_band_hz = [150, 600] / lead = 109 로 학습됐다. 현재 설정이 유도하는 값은
#   [150, 1600] / 116 이다. lead 차이는 파인튜닝이 흡수하도록 설계됐지만 **대역 차이는
#   다르다** — 좁은 대역으로 학습한 모델은 벌점이 없던 600-1600Hz 를 적극 증폭한다
#   (configs/duct.yaml 의 실측: [150,800] 설정에서 600-1600Hz +27.01 dB).
#   즉 이 init 은 고역 증폭기다. 현재 completed_init_checkpoint 게이트는 이 축을 보지
#   않으므로 PASS 한다. 사전학습을 새 대역·새 손실로 다시 돌리는 편이 옳다.

# 배포 후보는 tiny 다. base 와 동일 조건(100k step, 같은 seed·데이터)으로 비교한 결과
# held-out trusted NMSE 가 tiny 쪽이 낫고 Jetson 지연 여유도 크다. 진입점이 base 를
# 가리키면 게이트가 열리는 순간 **배포하지 않을 모델**을 파인튜닝하게 된다.
stage: open_loop                # 1차 파인튜닝은 open_loop, 이후 closed_loop 로 변경
model_config: configs/model_tiny.yaml
data_config: configs/data_sim.yaml
duct_config: configs/duct.yaml

# 실측 세션 파인튜닝이 surrogate P(z)로 조용히 실행되는 사고를 막는다.
# duct.digital_reference.primary_path_npz를 채우고 실행 시
# `--set data.digital_primary_path_mode=measured`를 반드시 함께 지정한다.
require_measured_primary_path: true
require_init_checkpoint: true
require_recorded_manifest: true

# scripts/train/check_finetune.py와 train.py가 공용하는 실패-폐쇄 진입 기준.
# 실제 official P/S와 recorded 데이터가 없으면 어떤 항목도 우회하지 않는다.
readiness:
  # 2026-08-05 정정 — 앞선 [150, 600] 축소는 **틀린 전제** 위에 있었다.
  #
  # 축소 근거는 "S(z) 가 1000-1600Hz 에서 0.73~0.75 로 게이트 0.90 을 못 넘는 것은
  # Ø40 사이드브랜치 드라이버가 그 대역에서 덕트와 약하게 결합하는 물리 한계" 였다.
  # 저장된 원시 캡처 11건을 재분석한 결과 그 낮은 값의 원인은 물리가 아니라 측정
  # 후처리 결함 **둘**이었다: (a) 출력 버퍼 프레임 슬립 반복(P−S 상대 τ 가 1.4→32
  # 샘플 점프)을 안 버린 것, (b) 워밍업 4주기 직후의 첫 분석 주기(아직 정상상태가
  # 아니다 — 국소 드리프트 10.4 vs 정상 4.4 샘플/주기)를 정렬 기준으로 쓴 것.
  #
  # 두 결함을 고치면 1000-1600Hz 반복 일관성이 P 0.9992~0.9998 / S 0.9989~0.9998 로,
  # 유효 캡처 9건 전부에서 재현된다. 즉 고역은 처음부터 측정 가능했다.
  #
  # 현행 아티팩트(캡처 225546_f7b0fecd 재분석)의 부대역 일관성:
  #     대역 Hz     P        S       독립캡처 7건 간 |H| 편차(S)   복소형상 일관성(S)
  #     80-150   0.9273   0.7584           27.8%                     0.9807
  #     150-300  0.9994   0.9983            2.1%                     0.9998
  #     300-600  0.9995   0.9995            2.9%                     0.9995
  #     600-1000 0.9982   0.9981            4.8%                     0.9978
  #     1000-1600 0.9995  0.9994            3.7%                     0.9978
  # 오른쪽 두 열은 **반복 재현성이 아니라 독립 캡처 간 재현성**이다 — 근접장·마운트
  # 같은 계통 오차는 반복 간에 공통으로 실려 왼쪽 두 열에는 잡히지 않으므로 따로 쟀다.
  # 1000-1600Hz 가 300-600Hz 와 같은 급이라는 것이 대역 확대의 실제 근거다.
  #
  # 하한 150Hz 는 그대로 둔다 — 이쪽은 진짜 한계다. 상쇄 스피커의 |S| 가 72Hz 에서
  # 200Hz 대비 −39dB 이고, 80-150Hz 는 반복 일관성 0.758 · 독립 캡처 간 |H| 편차
  # 27.8% 로 측정도 안 되고 제어 권한도 없다. 하한을 80 으로 되돌리면 부대역 게이트가
  # 영구 FAIL 이 되어 우회 압력이 생긴다 — 되돌리려면 상쇄 트랜스듀서 교체가 선행이다.
  #
  # ⚠ 이 확대는 loss.nmse_objective=trusted_band 가 최적화하는 대역도 함께 넓힌다
  #   (trusted band 의 단일 출처는 S npz 의 consistency_band_hz = [150,1600] 이다).
  #   결함 3(대역 밖 고역 −17~−21dB 증폭)이 살아 있는 상태에서 대역만 넓히면
  #   gradient 가 고역으로 쏠려 150-600Hz 가 오히려 나빠질 수 있다. 파인튜닝 재개는
  #   손실의 대역 밖 do-no-harm 항과 **함께** 들어가야 한다.
  #
  # 이 요구가 헐거워지지 않도록 측정 아티팩트에 consistency_band_hz 와 부대역별
  # band_consistency 를 함께 저장하고, 게이트가 (1) 일관성을 잰 대역이 이 요구 대역을
  # 덮는지, (2) 요구 대역 안 **모든** 부대역이 min_path_consistency 를 넘는지 검사한다.
  # 총계는 에너지 가중이라 약한 대역을 숨긴다 — 평균이 아니라 최악값이 기준이다.
  required_path_band_hz: [150, 1600]
  # 0.9 → 0.9406. 맨숫자가 아니라 **유도된 값**이다:
  #   required_consistency_for(12.0 dB) = 1 / (1 + 10^(-1.2)) = 0.9406
  # 뜻: 각 경로가 개별적으로 12 dB 상한을 지탱해야 한다. 왜 12 인가 — 설계 상한이
  # 6.53 dB 이므로 그 2배를 요구하면 **플랜트가 구속 조건이 되는 일이 없다.**
  # 이전 값 0.9 는 암묵적으로 상한 9.54 dB 를 뜻했고 아무도 그렇게 읽지 않았다.
  #
  # 현행 아티팩트는 여유 있게 통과한다 (S 0.9990 / P 0.9993). 이 임계를 내리려면
  # "목표를 몇 dB 로 내리겠다"를 먼저 적어야 하므로 되돌리기가 눈에 띈다 —
  # 근거를 주석이 아니라 유도식에 박아 두는 것이 요점이다.
  min_path_consistency: 0.9406
  required_recorded_ratio: 0.7
  min_recorded_sessions: 80
  min_recorded_duration_seconds: 5400   # 1.5시간; 권장 수집량은 3–4시간
  required_source_families: [speech, music, environment, machine]

  # ------------------------------------------------------------------------------
  # 달성 가능 상한 게이트 (plant_confidence_ceiling)
  # ------------------------------------------------------------------------------
  # 목표를 dB 로 **선언**하게 만드는 것이 요점이다. 지금까지 min_path_consistency=0.9
  # 는 근거 없는 숫자로 보였지만 실제로는 "상쇄 상한 9.54 dB" 를 뜻했고, 아무도 그렇게
  # 읽지 않았다. 목표를 적으면 필요한 γ 를 required_consistency_for() 로 역산할 수
  # 있어 임계가 물리로부터 유도된 값이 된다.
  #
  # ⚠ 두 상한이 있고 게이트는 **작은 쪽**으로 판정한다.
  #   (1) 플랜트 일관성 상한 = −10·log10((1−γ_S)/γ_S + (1−γ_P)/γ_P)
  #       복구된 플랜트(γ_S 0.9990 / γ_P 0.9993) → 약 27.7 dB.
  #       이것은 "플랜트를 몰라서 잃는 몫"만 센다.
  #   (2) 정규방정식 설계 상한 = 실제로 풀어 본 최적 FIR 의 잔차.
  #       M=2048, handoff 256, lead=116, 150-600Hz → **−6.53 dB** (독립 캡처 교차
  #       최악 −6.44). 인과성과 필터 길이가 진짜 병목이라 (1)보다 4배 이상 낮다.
  #
  # 그래서 목표는 6.53 이 아니라 그보다 낮게 잡는다. 여유 3 dB 규칙을 적용하면
  # 상한 6.53 에서 통과 가능한 최대 목표는 3.53 dB 다.
  #
  # ⚠ 2026-08-06 통합 검증 — **3.0 → 1.0.** 위 문단의 6.53 이 [150,600]Hz 값이었고
  # 요구 대역이 [150,1600] 으로 넓어지면서 상한이 4.58 로 내려갔는데, 목표 3.0 은
  # 옛 상한에 맞춰 놓은 값 그대로 남아 있었다. 낮추는 것이 아니라 **상한 정정을 뒤늦게
  # 반영하는 것**이다. 게이트는 여전히 구속력이 있다(1.0 + 3.0 = 4.0 < 4.58).
  #
  # 1.0 은 서로 독립인 두 축이 동시에 허용하는 값이다 — 한 축만 보고 정하지 않았다.
  #
  #  (축 A) 게이트 산술 — 대역평균, 대역제한 백색:
  #     상한 4.58 − 여유 3.0 = 목표 상한 1.58. 1.0 은 그 아래 0.58 dB 여유.
  #     통합 검증의 독립 재현(정규방정식 직접 풀이, M=2048, ridge 1e-10):
  #       150-600 −6.52 / 150-1000 −5.45 / **150-1600 −4.77** dB.
  #     4개 세션의 독립 재현이 −4.56 / −4.57 / −4.75 / −4.77 / −4.91 로 흩어지므로
  #     선언값은 그중 **가장 보수적인 4.58** 을 유지한다(올리지 않는다).
  #     M 스캔 256/512/1024/2048/4096/8192 → −3.64/−4.24/−4.66/−4.77/−4.79/−4.79.
  #     용량은 병목이 아니다(4배 늘려 0.02 dB).
  #
  #  (축 B) 절대목표 2 — "모든 소리". 평균이 아니라 **소스별 최악값**이다.
  #     data/source_pool 실측 80개 클립의 PSD 로 각각 최적 필터를 풀었다
  #     (소스적응 = DNN 이 실제로 할 수 있는 것의 상한):
  #       speech 최악 −2.94 / music 최악 −3.55 / environment 최악 −1.62 / machine 최악 −3.53
  #       전체 중앙 −6.54, **전체 최악 −1.62 dB (environment_011.wav)**
  #     단일 고정 필터라면 전체 최악 −0.35 dB 로 더 나쁘다.
  #     목표 1.0 은 이 최악 소스의 상한 1.62 아래로 0.62 dB 여유를 남긴다.
  #     축 A 만 보고 1.5 를 잡으면 **최악 소스에서 물리적으로 달성 불가능**해진다.
  #
  # 왜 여유 3.0 을 낮추지 않는가: 그것이 "상한에 붙여 목표를 잡기"이고, 근거 없는
  # 숫자를 근거 없이 더 깎는 것이다. 낮춰야 할 것은 목표 쪽이었다.
  #
  # 왜 lead 를 올려 상한을 사지 않는가: 살 수 있다는 것은 확인했다(직접 계산,
  # 150-1600Hz, M=2048): lead 116 −4.77 / 400 −10.60 / 800 −15.90 / 1200 −19.31 dB.
  # (lead 3200 의 −0.22 는 물리가 아니라 FIR 길이 한계다 — 필요 정렬 지연 3084 >
  #  M−1=2047. M=4096 으로 늘리면 되살아난다.) 그러나 lead 상향은 (1) dsp/timing.py 의
  # `Lead` 불변식을 == 에서 ≥ 로 바꾸는 **설계 변경**이고, (2) lead−116 만큼 재생을
  # 실제로 늦추므로 "미리 렌더링된 소스" 에서만 정직하며, (3) 최종 배포인 acoustic-ref
  # 에는 옮겨 적을 수 없다(그쪽 광대역 상한은 예측 지평 1578 샘플에서 사실상 0 dB).
  # 셋 다 사람이 선언해야 하는 사항이라 이번 세션에서 건드리지 않았다. HANDOFF 참조.
  target_cancellation_db: 1.0
  cancellation_ceiling_margin_db: 3.0

  # ⚠ 2026-08-06 통합 검증에서 정정. 이전 값은 `measured_design_ceiling_db: 6.53` 이었고
  # 대역 표시가 없었다. 6.53 은 **150-600Hz** 에서 푼 값인데 required_path_band_hz 는
  # [150, 1600] 이다 — 즉 좁은 대역의 낙관적 상한으로 넓은 대역 요구를 통과시키고 있었다.
  # 같은 아티팩트로 150-1600Hz 정규방정식을 다시 풀면(독립 재현 2회):
  #     대역        M=2048      M=4096
  #     150-600    −5.3~−6.0   −5.3~−6.1
  #     150-1000   −5.3~−5.4   −5.3~−5.5
  #     150-1600   −4.1~−4.6   −4.1~−4.7      ← 요구 대역. 6.53 보다 2 dB 낮다
  # 플랜트 복구 보고의 값(같은 캡처 −4.77 / 독립 캡처 교차 최악 −4.58)과 같은 급이다.
  # 상한에는 항상 **여러 캡처 중 최악**을 쓴다 — 상한을 낙관적으로 잡는 것이 이 저장소가
  # 반복한 사고이기 때문이다.
  measured_design_ceiling_db: 4.58
  measured_design_ceiling_band_hz: [150, 1600]   # 이 대역이 required_path_band_hz 를 덮어야 한다
  #
  # ⛔ 이 정정은 한때 plant_confidence_ceiling 을 **FAIL** 시켰다 (4.58 < 3.0 + 3.0).
  #    2026-08-06 통합 검증이 선택지 (a) 를 택해 목표를 1.0 으로 내리면서 해소됐다
  #    (위 target_cancellation_db 주석에 축 A/축 B 근거). 선택하지 않은 길을 남겨 둔다:
  #      (b) 여유를 1.5 로 내린다 — 상한에 붙여 목표를 잡는 셈이라 **비채택**
  #      (c) lead / 트랜스듀서 / FIR 구조를 바꿔 상한 자체를 올린다
  #          (FIR 길이는 아니다 — 2048→8192 로 늘려도 −4.77→−4.79 dB)
  #    required_path_band_hz 를 [150,600] 으로 되돌려 통과시키는 것은 **금지**다.
  #    그러면 절대목표 1(고역)을 측정조차 못 한다.
  #
  # ⚠ 이 게이트가 PASS 해도 절대목표가 달성 가능하다는 뜻이 **아니다.** 게이트 축은
  #   [150,1600]Hz 에너지가중 **평균**이고, 절대목표 1 은 옥타브밴드별 최악값이다.
  #   같은 최적 필터의 대역 내 1/3옥타브 잔차를 직접 계산하면(통합 검증):
  #     200Hz −26.1 / 250 −22.9 / 315 −13.8 / **400 +0.3** / 500 −1.6 / 630 −3.1 /
  #     800 −20.9 / 1000 −12.0 / **1250 −0.7** dB
  #   즉 400Hz 와 1250Hz 는 lead=116 에서 **상한 자체가 0 dB** 다. 평균 목표 1.0 을
  #   달성해도 그 두 밴드는 0 인 채로 "달성" 이 선언될 수 있다. 절대목표 축을 게이트로
  #   만들려면 최악 1/3옥타브 상한을 별도 키로 선언하고 게이트가 둘 다 보게 해야 한다 —
  #   그것은 게이트 코드 변경이라 이번 세션에서 하지 않았다.
  #
  # 위 값의 출처: 2026-08-05 플랜트 복구, 캡처 225546_f7b0fecd.
  # FIR 길이 스캔 512/1024/2048/4096/8192 → −3.87/−4.08/−4.15/−4.16/−4.16 dB
  # (150-1600Hz, PSD 가중) 이므로 **용량은 병목이 아니다** — 길이를 4배 늘려도
  # 0.01 dB 다. 이 상한을 올리려면 lead 나 트랜스듀서를 바꿔야 한다.

  # ------------------------------------------------------------------------------
  # 통계적 검정력 (recorded_statistical_power) — 결함 4 / D3
  # ------------------------------------------------------------------------------
  # 계열 평균의 불확도는 세그먼트 수가 아니라 **그룹 수**가 정한다(같은 그룹 안의
  # 세그먼트는 독립이 아니다). 실측: 계열 내 그룹 간 잔차 SD 1.46 dB → 그룹 2개면
  # 평균 SE 1.03 dB 인데 파인튜닝 후 계열 간 전체 폭이 0.92 dB 였다. **폭 < 1 SE** 라
  # "최악 계열" 선택이 동전 던지기였다. 그룹 1개면(val machine, test environment,
  # test machine) 오차 추정 자체가 불가능하다.
  #
  # 현재 manifest 는 이 값을 만족하지 못한다 — 재수집 요구사항이며, 그것이 옳다.
  # 같은 그룹 안의 세션을 늘려도 클러스터 수는 늘지 않는다.
  min_groups_per_family_per_split: 4

  # ------------------------------------------------------------------------------
  # 학습 데이터 정렬 (recorded_alignment_integrity) — 결함 2
  # ------------------------------------------------------------------------------
  # QA 와 게이트가 **같은 임계**를 쓰도록 여기서 한 번만 선언한다.
  # 실측 정상 coh² 0.96~0.99 / 붕괴 0.02~0.13 — 그 사이의 넓은 골짜기에서 0.60.
  # 지연 안정성 실측: 음향 대조군 std 17.7~20.1 / range 106~215,
  #                   붕괴 세션 std 1019~2216 / range 8869~13532.
  min_source_err_coherence: 0.60
  min_ref_err_coherence: 0.60
  max_source_err_delay_std_samples: 64
  max_source_err_delay_range_samples: 256

  # ------------------------------------------------------------------------------
  # 코퍼스 누수 (corpus_disjoint) — D1
  # ------------------------------------------------------------------------------
  # 실측 music 60/60(100%)이 합성 풀과 겹치고 그중 55개가 합성 train 에 있다.
  # 같은 곡에 상충하는 정답이 주어지고, **music 만 개선되지 않았다**(+0.09 dB).
  recorded_source_pool_csv: data/source_pool/sources.csv

  # ------------------------------------------------------------------------------
  # 실측-측정 지연 교차검증 (measured_source_delay_agreement) — D2
  # ------------------------------------------------------------------------------
  # 관측(독립 3방법 일치): 포락선 상관 80세션 중앙값 1672 / 반송파 상관 40세션
  # 1663±73 / 제어기 시작지연 스윕 ~1670.
  # 유도: P 벌크지연 1602 + argmax tap 247 = 1849.  차이 ≈ 177 샘플(3.7 ms).
  #
  # 허용 64 샘플의 근거(임의의 숫자가 아니다):
  #   1. 관측 불확도 — 세션 간 SD 73 → 8세션 중앙값의 SE ≈ 26 → 64 는 2.5σ
  #   2. 기하학적 의미 — 64 샘플 = 1.33 ms = 공기 중 0.46 m.
  #      NS→ERR 거리 1.10 m 의 42% 다. 이보다 크면 마이크 위치를 모르는 것과 같다.
  #   3. 검출력 — 실제 결함 177 샘플은 허용치의 2.8배
  max_measured_delay_mismatch_samples: 64
  min_delay_crosscheck_sessions: 8
  # init checkpoint 의 lead 는 surrogate 물리로 학습할 때 쓴 잠정값이다. 실측이
  # 끝나면 몇 샘플 달라지는 것이 정상이고(실측 109/113/116/119, 폭 10샘플),
  # 그 차이를 흡수하는 것이 파인튜닝의 목적이다. 현재 checkpoint 109 vs 실측 113
  # = 4샘플(83µs, 600Hz 에서 0.031 rad).
  #
  # 정확성은 path_delay_and_lead 가 지킨다 — 이 설정의 lead 가 실측 S+handoff−P 와
  # 정확히 같아야 통과한다. 아래 허용치는 "어느 checkpoint 에서 출발할 수 있는가"
  # 에만 관여하며, 과거 사고였던 lead=0 checkpoint 는 113샘플 차이라 통과 못 한다.
  max_init_lead_mismatch_samples: 16
  require_completed_init_checkpoint: true
  max_init_best_metric_db: 0.0
  allowed_init_physics_statuses: [secondary_surrogate_representation_pretrain]

init_ckpt: runs/pretrain_tiny_corrected/ckpt/best.pt

recorded_manifest: data/manifests/recorded_train.jsonl
recorded_ratio: 0.7             # 실측:합성 = 7:3 혼합 배치

batch_size: 16
num_workers: 8
prefetch_factor: 4

optimizer:
  name: adamw
  lr: 1.0e-4                    # 사전학습 대비 1/10
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

schedule:
  warmup_steps: 1000
  total_steps: 50000            # closed_loop 시 20000~50000 권장 [교차검증 H1]
  min_lr: 1.0e-6

amp: bf16
grad_clip: 5.0
freeze_encoder: false           # 데이터가 적으면 true 시도

loss:
  # 2026-08-06 정합화 — 이 블록은 configs/train_pretrain.yaml 의 loss 블록과 **같아야 한다**.
  # 파인튜닝은 사전학습이 최적화한 것과 다른 목적함수를 이어받으면 안 된다.
  # 아래 근거 주석의 원본은 train_pretrain.yaml 에 있다(중복을 줄여 요약만 적는다).

  # 실측 S(z) 유효대역 ∩ duct 목표대역 NMSE를 최소화.
  # fullband NMSE는 do-no-harm 관측 지표로 별도 기록한다.
  nmse_objective: trusted_band

  # --- 절대목표 2: 최악값 집계 ---
  nmse_cvar_q: 0.25
  nmse_cvar_alpha: 0.7
  nmse_cvar_min_k: 4

  # --- 절대목표 1: 대역 밖 악화 금지 (단측, S 위상 무관) ---
  # 대역 목록은 신뢰대역 여집합에서 자동 유도된다 — S npz 가 [150,600]→[150,1600] 으로
  # 넓어져도 여기에 고칠 곳이 없다.
  # ⚠ λ 는 사전학습 시절 대역 구성에서 잡은 값이고 자동 유도된 새 대역에서 **재교정되지
  #   않았다** (실측 ‖λ∇dnh‖/‖∇nmse‖ = 1332%, 설계 목표 20~40%). 20k step ablation 전에
  #   그래디언트 예산을 다시 재고 λ 를 확정하라. 지금 값은 사전학습과 같게 두는 쪽을 택했다
  #   — 두 단계가 다른 목적함수를 쓰는 것이 더 나쁘기 때문이다.
  lambda_dnh: 0.12
  # dnh_margin_db 는 **적지 않는다** — G4 게이트 임계(1.0 dB)에서 유도된다(-18.27 dB).
  #   2026-08-06 실측: 여기 적혀 있던 +6.0 을 정확히 만족한 모델이 게이트를 8.5 dB
  #   차이로 FAIL 했다(4000 Hz 옥타브 -9.53 dB). 손실과 게이트가 서로를 모르고 각자
  #   숫자를 들고 있었다. 유도는 src/deep_anc/dsp/do_no_harm.py 한 곳이고, 여기에 값을
  #   되쓰면 LossConfig 가 거부한다.
  dnh_weight_below: 1.0
  dnh_weight_above: 2.0

  # --- 시간 국소성 (절대목표 2 의 시간축) ---
  # 1.5초 한 FFT 로 최악 아이템이 +0.00 dB 여도 0.17초 프레임으로 보면 +10.82 dB 였다.
  lambda_frame: 0.5
  nmse_frame_samples: 8192
  nmse_frame_silence_db: -40.0

  # --- 스펙트럼 형상 (신뢰 대역 한정) ---
  mrstft_ffts: [256, 512, 1024, 2048]
  lambda_mrstft: 1.0
  # curriculum_a 였다. 그것은 신뢰 대역 **밖**에도 양측 가중(1.0 / cutoff 위 0.25)을 줘서
  # "S(z) 를 못 믿는 곳에서 상쇄하라"고 요구하고, 같은 주파수에 걸린 단측 do-no-harm
  # 힌지와 서로 밀어낸다. 대역 밖 압력은 전부 힌지가 담당해야 한다.
  band_weight: trusted_only     # curriculum_a | fullband | trusted_only

  # --- 출력 제약 ---
  # lambda_pow / lambda_clip / clip_margin 세 키를 지웠다. 모델이 y = L·tanh(u/L) 라
  # relu(|y|−0.18)² 의 상한이 4.0e-4 로 고정 = 구조적으로 죽은 항이었고, 리미터 한계는
  # 이제 모델이 단일 출처다. 세 키가 남아 있으면 LossConfig 가 DeprecationWarning 만
  # 내고 조용히 무시한다 — 죽은 설정이 다음 사람을 속이는 것을 여기서 끊는다.
  lambda_pow: 0.0               # 지표로만 남긴다
  lambda_sat: 1.0               # 리미터 **이전** 활성 포화 벌점 (구 lambda_clip 대체)
  sat_margin: 2.0

# CVaR 은 분위 추정이다. val 16개면 q=0.25 가 top-4 뿐이라 추정이 흔들린다.
val_items: 64

eval_every: 1000
log_every: 100
# Trainer의 내장 val은 합성 16개뿐이라 실측 fine-tune 종료 권한으로 쓰지 않는다.
# 예정 step을 끝낸 뒤 독립 recorded val/test G4로 checkpoint를 판정한다.
early_stop_patience: 0
ckpt_dir: runs/finetune_tiny
resume: null
seed: 20260803
