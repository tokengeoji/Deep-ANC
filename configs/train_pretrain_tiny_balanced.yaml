# Stage-1 성능 파일럿 — 현행 150–1600Hz 네 subband 균등 최적화
#
# 이 파일은 기존 canonical pretrain을 덮어쓰지 않는 별도 pilot이다. 현재 strict
# P/S와 derived lead를 사용하지만, 실제 덕트 성능·배포 권한은 부여하지 않는다.
# canonical source/실측 raw/현재 115-sample checkpoint가 준비된 뒤에도, 이 pilot의
# 결과는 별도 measured 평가를 통과하기 전까지 성능 주장으로 사용하지 않는다.

stage: open_loop
experiment_role: performance_pilot
init_eligible: false
model_config: configs/model_tiny.yaml
data_config: configs/data_sim.yaml
data_model_input_contract_config: configs/stage1_ref_only_input.yaml
duct_config: configs/duct.yaml

batch_size: 96
num_workers: 14
prefetch_factor: 4

optimizer:
  name: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

schedule:
  warmup_steps: 1250
  total_steps: 100000
  min_lr: 1.0e-5

amp: bf16
grad_clip: 5.0

loss:
  # 개선 대상은 정확히 네 구간이다. 1600Hz 초과는 아래 DNH만 적용한다.
  nmse_objective: equal_subband
  nmse_subband_guard_alpha: 0.25
  nmse_cvar_q: 0.25
  nmse_cvar_alpha: 0.7
  nmse_cvar_min_k: 4
  lambda_dnh: 0.00075
  dnh_weight_below: 1.0
  dnh_weight_above: 2.0
  lambda_frame: 0.0
  nmse_frame_samples: 8192
  nmse_frame_silence_db: -40.0
  mrstft_ffts: [256, 512, 1024, 2048]
  lambda_mrstft: 1.0
  band_weight: trusted_only
  lambda_pow: 0.0
  lambda_sat: 1.0
  sat_margin: 2.0

val_items: 64
eval_every: 500
log_every: 100
early_stop_patience: 0
required_world_size: 1
contract_run_dir: false
run_until_step: 20000
ckpt_dir: runs/performance_pilot_tiny
resume: null
seed: 20260903
