# 오프라인/실기 평가 설정

# 옥타브 밴드 중심 주파수 (125Hz–8kHz) [교차검증 L2 — 63Hz/16kHz는 마이크·S(z) 유효대역 밖]
octave_bands_hz: [125, 250, 500, 1000, 1600, 2000, 4000, 8000]

# S(z) 신뢰 대역은 **여기서 선언하지 않는다.**
# 2026-08-06: `trusted_band_hz: [150, 600]` 을 지웠다. 어떤 코드도 이 키를 읽은 적이 없고
# (평가기는 전부 BandPlan.resolve(sp.trusted_band_hz(), duct.realistic_target_band_hz, fs/2)
# 로 유도한다), 값 자체도 이미 틀려 있었다 — 플랜트 복구 후 실제 신뢰대역은 [150, 1600] 이다.
# 죽은 설정이 권위 있어 보이면서 틀린 값을 들고 있는 것이 이 저장소가 반복한 사고다.
# 단일 출처: assets/measured/secondary_path_il.npz 의 consistency_band_hz
#            ∩ configs/duct.yaml acoustics.realistic_target_band_hz ∩ [0, fs/2].

# 시나리오는 프로젝트 절대 목표 2가지를 분리 측정한다:
#   기능1(저주파+고주파 노이즈 제거): tone300/multitone/band(저역) + hf_tone/hf_band(고역)
#   기능2(모든 소리 제거): nonlinear + file(음성/음악 wav 재생 — --set noise.file 지정)
# measure_band_hz: **그 시나리오의 소스가 실제로 에너지를 갖는 대역**이다.
# 이것을 두지 않고 모든 시나리오를 trusted_band(150-600Hz)로 재면, 소스가 그 대역에 없는
# 고역 시나리오는 잡음을 재게 된다 — 실측으로 hf_tone 은 trusted 대역 에너지가 0.47%,
# hf_band 는 0.12% 였고, 그때 나온 "-1.50 dB(증폭)" 은 신호가 아니라 잡음이었다.
# (같은 구간을 소스 대역에서 다시 재면 +0.46 dB 로 증폭이 아니라 무반응이다.)
scenarios:                      # scripts/demo/evaluate_session.py 시나리오
  - {name: tone300,   measure_band_hz: [250, 350],
     noise: {type: tone, frequency: 300, amplitude: 0.05}}
  - {name: multitone, measure_band_hz: [100, 800],
     noise: {type: multitone, frequencies: [120, 300, 750], amplitude: 0.04}}
  - {name: band,      measure_band_hz: [80, 1000],
     noise: {type: band, band: [80, 1000], amplitude: 0.05}}
  - {name: hf_tone,   measure_band_hz: [1150, 1250],    # 고역(컷오프 이하)
     noise: {type: tone, frequency: 1200, amplitude: 0.04}}
  - {name: hf_band,   measure_band_hz: [800, 1600],     # S(z) 광대역 재보정 후 유효
     noise: {type: band, band: [800, 1600], amplitude: 0.04}}
  - {name: nonlinear, measure_band_hz: [150, 900],
     noise: {type: nonlinear, frequency: 210, amplitude: 0.06}}
  # 2026-09-03 사용자 요청 — 단순 사인파가 아니라 합성파로 150-1600Hz 전체(현행 Stage-1
  # 4개 subband: [150,300],[300,600],[600,1000],[1000,1600])를 한 번에 실측한다.
  - {name: multitone_stage1, measure_band_hz: [150, 1600],
     noise: {type: multitone, frequencies: [225, 450, 800, 1300], amplitude: 0.04}}
  - {name: nonlinear_stage1, measure_band_hz: [150, 1600],
     noise: {type: nonlinear, frequency: 300, amplitude: 0.06}}
  # 2026-09-03 진단 — nonlinear_stage1(0.06)이 ANC ON 91.3%(<95%) 세이프티 mute로
  # 유효값을 못 낸 원인을 좁히기 위한 절반 진폭 재시도.
  - {name: nonlinear_stage1_lowamp, measure_band_hz: [150, 1600],
     noise: {type: nonlinear, frequency: 300, amplitude: 0.03}}

# 측정 대역에 소스 에너지가 이 비율 미만이면 headline 감쇠를 발행하지 않는다.
min_source_energy_fraction_in_measure_band: 0.5

# 각 octave의 감쇠값은 OFF 구간에서 실제 ch0으로 재생한 source의 해당 octave PSD가
# 20 Hz–Nyquist 평균 PSD의 이 비율 이상일 때만 발행한다. ERR 마이크의 잡음 floor가
# 아니라 source 출력으로 판정한다. octave 폭으로 정규화하므로 48 kHz broadband의
# 125 Hz도 보존하면서 80–1000 Hz source의 2 kHz filter tail은 무효가 된다.
min_source_energy_density_ratio_in_octave_band: 0.25

protocol:
  baseline_seconds: 10          # ANC OFF 베이스라인
  on_seconds: 30                # ANC ON
  tail_seconds: 5               # ANC OFF 복귀

# 미학습(held-out) 비선형 강도 평가축 [로드맵 A1] — 문헌(Deep ANC/ARN) 프로토콜과 정합:
# 학습 그리드(0.05/0.1/0.2) 밖의 중간 강도로 일반화를 측정한다.
heldout_sef_eta: 0.15

report_dir: results
