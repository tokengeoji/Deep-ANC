# 덕트 물리 파라미터 — 근거: docs/09_duct_structure.md (acrylic-duct-structure.md, 2026-08-02 갱신본)
# 값을 바꾸면 RIR 뱅크(build_rir_bank.py)를 다시 생성해야 시뮬레이션에 반영된다.

duct:
  shape: rectangular            # 문서용(코드 미소비) — 사각 아크릴(PMMA)
  wall_thickness_m: 0.010       # 문서용(코드 미소비)
  total_length_m: 1.200         # 문서용(코드 미소비) — 외형 전장
  interior_length_m: 1.190      # 좌측 폐단 내측면 ~ 개구 (duct_sim 소비)
  cross_section_m: [0.105, 0.105]
  boundary: closed_open         # 문서용(코드 미소비) — 시뮬은 closed–open 고정 구현
  speed_of_sound_mps: 343.0
  end_correction_factor: 0.61   # 개방단 보정 Δ = 0.61 · r_eq

positions_m:                    # X 좌표 (원점 = 좌측 폐단)
  noise_speaker: 0.0            # 단면 중앙, 축방향 방사 (외부 부착)
  reference_mic: 0.100          # 벽면 (부착면 미확정 — 문서 §8)
  cancel_speaker: 1.050         # 상면 side-branch, Ø40 (마운트 구간 0.990~1.110)
  error_mic: 1.100              # ⚠ 잠정값 (문서 §5 미확정, CS 마운트 구간과 겹침 이슈 §7) — 확정 시 갱신
  opening: 1.200

acoustics:                      # 문서 계산값 — tests/test_duct_sim.py 의 기준값
  plane_wave_cutoff_hz: 1633.0  # f_cut = c / (2·0.105)
  axial_resonances_hz: [70, 210, 350, 489, 629]   # closed-open, L_eff≈1.226m
  # 이 값이 학습 손실과 평가의 신뢰대역을 실제로 구속한다
  # (5곳에서 intersect(S.consistency_band_hz, 이 값, fs/2) 로 유도된다).
  # 2026-08-05: 800 → 1600 으로 넓혔다. 플랜트 복구로 S 일관성이 1000–1600Hz 에서
  # 0.737 → 0.999 가 됐고, 넓힘의 손익을 최적 인과 Wiener 필터로 직접 계산해 확인했다:
  #
  #   설계 대역        150–600   600–1600   1633–8000(대역밖)
  #   [150, 800] 구설정  −11.83    **+27.01**    +30.66     ← 벌점 없는 대역을 적극 증폭한다
  #   [150,1600] 신설정  −11.57    **−10.50**    +22.70
  #   넓힘의 대가 +0.26 dB / 이득 −37.52 dB
  #
  # 즉 좁게 두는 쪽이 해로웠다 — 결함 3(고역 증폭)의 직접 기전이다.
  # ⚠ 1633Hz(평면파 차단) 위는 넓혀도 +22.7 dB 증폭이 남는다. 그 대역은 S 를 신뢰할 수 없으므로
  #   "개선 요구" 가 아니라 **손실의 do-no-harm 항으로 "악화 금지"** 를 걸어야 한다.
  realistic_target_band_hz: [80, 1600]            # 실측 S 신뢰대역에 맞춘 목표 대역

reflection:                     # 1D 영상법 시뮬 파라미터 (실측 후 갱신 가능)
  closed_end: 0.80              # 폐단(스피커 배플) 반사계수 추정
  open_end: -0.45               # 개방단 반사(위상 반전) 저역 추정
  per_reflection_lowpass_hz: 4000.0

secondary_path:                 # 학습·런타임·평가가 공용하는 단일 정의 (이중 정의 금지 — 감사 M9)
  # 2026-08-05 재분석본 (캡처 20260804_225546_f7b0fecd, 48주기 중 18유지, 앵커 13).
  # P 와 **같은 캡처·같은 반복 집합·같은 앵커**에서 나왔고 capture_id 가 일치한다.
  # delay=1462샘플, FIR 2048탭, 150-1600Hz 반복 일관성 0.9990
  # (부대역 최소 0.9981 @600-1000Hz, 1000-1600Hz 0.9994).
  #
  # 앞선 산출물(캡처 03f4c088, 16반복 전부 사용, 150-600Hz 0.9556)은 프레임 슬립
  # 반복 6개와 정상상태 미도달 반복 2개를 그대로 평균해 형상이 절반쯤 틀려 있었다.
  # scripts/data/reanalyse_paths_interleaved.py 가 저장된 원시 캡처만으로 이것을
  # 재생성한다 — 스피커를 다시 울리지 않는다. 백업: *_il.npz.orig
  # 구버전 assets/measured/secondary_path_4s.npz(순차 ESS, coherence 0.40)는 폐기.
  npz: assets/measured/secondary_path_il.npz
  # 3-스레드 런타임은 캘리브레이션(콜백 내 즉시 출력) 경로보다 1 hop 늦게 출력한다.
  # 학습 플랜트 지연 = delay_samples + handoff_extra_samples  [설계 교차검증 C1]
  # (지연 지터 증강 범위는 data_sim.yaml plant_perturbation.delay_jitter_range 가 단일 출처)
  handoff_extra_samples: 256

digital_reference:
  # noise 출력→error mic의 compact FIR+순수지연 단일 출처. measured는 FIR+delay를,
  # canonical secondary_surrogate는 delay를 이 NPZ에서 직접 읽는다. 절대 지연을
  # YAML 숫자로 복사하면 같은 캡처의 P/S 관계가 깨지므로 별도 delay 키는 두지 않는다.
  primary_path_npz: assets/measured/primary_path_il.npz

# 입출력 정규화 스케일은 모델 설정(model_*.yaml io_scale)이 단일 출처다 (감사 M8)
