# GPU0 작업 큐 — base 100k 완주 직후를 이어받는다.
#
# 지금 띄워서 진입 게이트에서 대기시켜야 base 가 끝나는 순간(약 04:45 KST) 유휴가 0이 된다.
# 이 파일은 감독자가 매 작업 후 다시 읽으므로 작업을 덧붙이면 재기동 없이 반영된다.

schema_version: 1
execution_class: legacy_diagnostic
gpu: 0
python: .venv/bin/python
state_dir: runs/queue

tunables:
  poll_seconds: 60
  gpu_free_confirmations: 3
  gpu_free_poll_seconds: 10
  gpu_free_memory_threshold_mib: 1024
  settle_seconds: 15
  status_interval_seconds: 60
  drained_poll_seconds: 300
  min_free_gb: 10

entry_gate:
  wait_for_pids:
    - pid: 22554
      cmdline_contains: ["train.py", "pretrain_base_corrected"]
      note: "base 100k 학습 — 완주 대기(재시작 금지)"
  require_gpu_free: true

adopt:
  - id: adopt_base
    run_dir: runs/pretrain_base_corrected
    expect: {step: 100000, model_name: hybrid_anc_base, total_steps: 100000}

jobs:
  # ── Tier A: base 최종 held-out 평가 ──────────────────────────────────
  # 구조 탐색이 하듯 best/last 양쪽을 본다. HANDOFF 가 "best.pt 만 맹신 금지"를 명시했다.
  - id: eval_base_final_last
    kind: shell
    tier: A
    reason: "base last.pt held-out 재평가 (source×band 포함)"
    depends_on: [adopt_base]
    command:
      - .venv/bin/python
      - scripts/eval/evaluate_offline.py
      - --ckpt
      - runs/pretrain_base_corrected/ckpt/last.pt
      - --n-items
      - "64"
      - --out
      - runs/pretrain_base_corrected/eval_final_last
    on_failure: retry_then_continue
    max_retries: 1

  - id: eval_base_final_best
    kind: shell
    tier: A
    reason: "base best.pt held-out 재평가"
    depends_on: [adopt_base]
    command:
      - .venv/bin/python
      - scripts/eval/evaluate_offline.py
      - --ckpt
      - runs/pretrain_base_corrected/ckpt/best.pt
      - --n-items
      - "64"
      - --out
      - runs/pretrain_base_corrected/eval_final_best
    on_failure: retry_then_continue
    max_retries: 1

  # seed 반복은 GPU1 큐로 옮겼다. 같은 id·같은 ckpt_dir 을 두 큐에 두면 두 감독자가
  # 같은 run 을 돌려 checkpoint 를 서로 덮어쓴다 — 실제로 GPU0 이 GPU1 의 완료 run 을
  # step 1000 으로 덮어썼다. 한 run 은 한 큐에만 둘 것.

  # ── Tier A: tiny 를 base 와 같은 조건에서 평가 ──────────────────────────
  # 로컬 Jetson 평가는 data/manifests 와 RIR 뱅크가 없어 소스별 표에 synthetic 만 남는다.
  # 즉 **기능 2(모든 소리)를 로컬에서는 측정할 수 없다.** 배포 후보를 고르려면 tiny 와
  # base 를 같은 데이터에서 봐야 하므로 여기서 돌린다.
  - id: eval_tiny_final_last
    kind: shell
    tier: A
    reason: "tiny last.pt 를 base 와 동일한 held-out 조건에서 평가 (소스별·밴드별)"
    command:
      - .venv/bin/python
      - scripts/eval/evaluate_offline.py
      - --ckpt
      - runs/pretrain_tiny_corrected/ckpt/last.pt
      - --n-items
      - "64"
      - --out
      - runs/pretrain_tiny_corrected/eval_final_last
    on_failure: retry_then_continue
    max_retries: 1

  - id: eval_tiny_final_best
    kind: shell
    tier: A
    reason: "tiny best.pt 동일 조건 평가"
    command:
      - .venv/bin/python
      - scripts/eval/evaluate_offline.py
      - --ckpt
      - runs/pretrain_tiny_corrected/ckpt/best.pt
      - --n-items
      - "64"
      - --out
      - runs/pretrain_tiny_corrected/eval_final_best
    on_failure: retry_then_continue
    max_retries: 1

  # ── Tier A: 회수 번들 ────────────────────────────────────────────────
  # 회수 지연이 곧 과금이다. SHA-256/크기/경로를 미리 계산해 둔다.
  - id: handoff_bundle
    kind: bundle
    tier: A
    reason: "회수 대상 산출물의 SHA-256/크기 목록 생성"
    command:
      - runs/*/ckpt/*.pt
      - runs/*/config_snapshot.yaml
      - runs/*/eval_*/metrics.md
      - runs/*/eval_*/metrics.npz
    on_failure: continue
