# GPU1 작업 큐 — 구조 탐색 watcher 종료 직후를 이어받는다.
#
# 배경: 원격 watcher(run_structure_search.sh, PID 24271)는 구버전이라 후보 3개만
# 돌리고 **20k 예산의 tiny 대조군이 없다**. pretrain_tiny_corrected 는 100k 완주 run
# 이라 20k 시점 checkpoint 가 남아 있지 않아(last.pt 는 매 eval 덮어쓰기, best.pt 는
# step 89,500) evaluate_offline 로 비교할 수 없다. 따라서 대조군을 먼저 만든다.
#
# 이 파일은 감독자가 매 작업 후 다시 읽는다. 작업을 덧붙이면 재기동 없이 반영된다.

schema_version: 1
execution_class: legacy_diagnostic
gpu: 1
python: .venv/bin/python
state_dir: runs/queue

tunables:
  poll_seconds: 20
  gpu_free_confirmations: 3
  gpu_free_poll_seconds: 10
  gpu_free_memory_threshold_mib: 1024
  settle_seconds: 15
  term_grace_seconds: 20
  status_interval_seconds: 30
  drained_poll_seconds: 300
  min_free_gb: 10

entry_gate:
  # tiny_long_attn 완주까지 절대 개입하지 않는다.
  wait_for_pids:
    - pid: 24271
      cmdline_contains: ["run_structure_search.sh"]
      note: "기존 GPU1 구조 탐색 watcher — tiny_long_attn 완주 대기"
  # lock 획득 성공 = 구 watcher 가 확실히 죽었다는 커널 보장(PID 폴링보다 강하다).
  # 획득 후 계속 보유해 구 watcher 재실행 자체를 차단한다.
  acquire_locks: ["runs/.structure_search.lock"]
  require_gpu_free: true

# 구 watcher 산출물은 재실행하지 않고 검증만 한다.
adopt:
  - id: adopt_tiny_long
    run_dir: runs/search_tiny_long
    expect: {step: 20000, model_name: hybrid_anc_tiny_long, total_steps: 100000}
  - id: adopt_tiny_attn
    run_dir: runs/search_tiny_attn
    expect: {step: 20000, model_name: hybrid_anc_tiny_attn, total_steps: 100000}
  - id: adopt_tiny_long_attn
    run_dir: runs/search_tiny_long_attn
    expect: {step: 20000, model_name: hybrid_anc_tiny_long_attn, total_steps: 100000}

jobs:
  # ── Tier A ────────────────────────────────────────────────────────────
  - id: search_tiny_control
    kind: train
    tier: A
    compare: true
    reason: "20k 대조군 부재 — 구조 비교 공정성의 기준선"
    config: configs/train_pretrain.yaml
    model_config: configs/model_tiny.yaml
    ckpt_dir: runs/search_tiny_control
    overrides:
      batch_size: 128
      num_workers: 14
      prefetch_factor: 4
      schedule.total_steps: 100000
      schedule.warmup_steps: 1250
      run_until_step: 20000
      eval_every: 500
      early_stop_patience: 0
    expect: {step: 20000, model_name: hybrid_anc_tiny, total_steps: 100000}
    post_eval:
      - {ckpt: best, n_items: 32, out: eval_pilot_best}
      - {ckpt: last, n_items: 32, out: eval_pilot_last}
    on_failure: retry_then_continue
    max_retries: 1

  - id: select_structure_winner
    kind: decision
    tier: A
    reason: "사전 등록 규칙으로 승자 선정 — 결과를 보기 전에 확정된 기준"
    depends_on:
      - search_tiny_control
      - adopt_tiny_long
      - adopt_tiny_attn
      - adopt_tiny_long_attn
    decision:
      # model_config 를 함께 적는다 — 승자 이름만으로는 유도할 수 없다(tiny_control 의
      # 모델은 model_tiny.yaml 이라 이름 규칙이 깨진다).
      control:
        {name: tiny_control, run_dir: runs/search_tiny_control,
         model_config: configs/model_tiny.yaml}
      candidates:
        - {name: tiny_long, run_dir: runs/search_tiny_long,
           model_config: configs/model_tiny_long.yaml}
        - {name: tiny_attn, run_dir: runs/search_tiny_attn,
           model_config: configs/model_tiny_attn.yaml}
        - {name: tiny_long_attn, run_dir: runs/search_tiny_long_attn,
           model_config: configs/model_tiny_long_attn.yaml}
      # last 가 1차 지표인 이유: best.pt 는 고정 16개 val 배치에서 뽑혀 선택 편향이 있다.
      primary_eval: eval_pilot_last
      confirm_eval: eval_pilot_best
      margin_db: 0.30
      worsening_tolerance_db: 1.0

      # 승자가 정해지면 감독자가 이 템플릿으로 연장 작업을 즉시 큐에 넣는다. 이게 없으면
      # 결정 직후 큐가 말라 GPU 가 논다. winner_ambiguous 이거나 승자가 대조군이면
      # (tiny 100k 완주본이 이미 있으므로) 넣지 않는다.
      extension_template:
        id: extend_winner_100k
        kind: train
        tier: A
        long: true
        reason: "구조 승자를 동일 100k cosine 궤적으로 연장"
        config: configs/train_pretrain.yaml
        model_config: "{winner_model_config}"
        # 반드시 새 디렉터리 — 같은 곳에 쓰면 pilot 의 20k best/last 비교 근거가 사라진다.
        ckpt_dir: "runs/extend_{winner}_100k"
        # best 로 되감으면 optimizer/scheduler 가 후퇴해 예산을 낭비한다.
        resume: "{winner_run_dir}/ckpt/last.pt"
        copy_before_start:
          # trainer 는 best.pt 가 있을 때만 best_metric 을 min() 으로 교정한다.
          # 복사하지 않으면 20k best 를 넘기 전까지 best.pt 가 아예 없다.
          - {src: "{winner_run_dir}/ckpt/best.pt", dst: "runs/extend_{winner}_100k/ckpt/best.pt"}
        overrides:
          batch_size: 128
          num_workers: 14
          prefetch_factor: 4
          schedule.total_steps: 100000
          schedule.warmup_steps: 1250
          eval_every: 500
          early_stop_patience: 0
          # worker RNG 는 checkpoint 에 저장되지 않고 iterator 생성 시 재시드된다.
          # 원 seed 를 그대로 두면 step 20k-40k 가 0-20k 와 같은 데이터를 재생한다.
          seed: 20260902
          # run_until_step 미지정 → resolve_run_until_step() 이 total_steps(100000) 폴백
        expect: {step: 100000}
        post_eval:
          - {ckpt: last, n_items: 64, out: eval_final_last}
          - {ckpt: best, n_items: 64, out: eval_final_best}
        on_failure: retry_then_continue
        max_retries: 1
    on_failure: continue

  # ── 1차 선정의 오탐 교정 ────────────────────────────────────────────────
  # 첫 선정에서 후보 3종이 전부 "config fingerprint 불일치"로 실격됐다. 지문이
  # model/model_config 를 포함해서 생긴 오탐이며, 구조는 실험의 독립변수다.
  # 지문을 고친 뒤 같은 데이터로 다시 판정해 기록을 바로잡는다(CPU 수초).
  - id: reselect_structure_winner
    kind: decision
    tier: A
    reason: "지문 오탐 교정 후 재판정 — 결론이 '실격'이 아니라 '유의한 개선 없음'인지 확인"
    depends_on: [search_tiny_control, adopt_tiny_long, adopt_tiny_attn, adopt_tiny_long_attn]
    decision:
      control:
        {name: tiny_control, run_dir: runs/search_tiny_control,
         model_config: configs/model_tiny.yaml}
      candidates:
        - {name: tiny_long, run_dir: runs/search_tiny_long,
           model_config: configs/model_tiny_long.yaml}
        - {name: tiny_attn, run_dir: runs/search_tiny_attn,
           model_config: configs/model_tiny_attn.yaml}
        - {name: tiny_long_attn, run_dir: runs/search_tiny_long_attn,
           model_config: configs/model_tiny_long_attn.yaml}
      primary_eval: eval_pilot_last
      confirm_eval: eval_pilot_best
      margin_db: 0.30
      worsening_tolerance_db: 1.0
    on_failure: continue

  # ── seed 반복 ───────────────────────────────────────────────────────────
  # 승자 선정의 신뢰구간은 평가 아이템 간 분산만 덮고 run 간(seed) 분산은 덮지 않는다.
  # tiny_long 은 Δ −0.224, CI [−0.709, +0.255] 로 정확히 그 한계에 걸린 후보다.
  # 대조군과 짝을 맞춰 반복해야 paired Δ 의 seed 분산을 실측할 수 있다.
  - id: seed_repeat_control_20k
    kind: train
    tier: B
    compare: true
    reason: "대조군 seed 반복 — 구조 비교의 run 간 분산 실측"
    config: configs/train_pretrain.yaml
    model_config: configs/model_tiny.yaml
    ckpt_dir: runs/seed_repeat_tiny_control
    overrides:
      batch_size: 128
      num_workers: 14
      prefetch_factor: 4
      schedule.total_steps: 100000
      schedule.warmup_steps: 1250
      run_until_step: 20000
      eval_every: 500
      early_stop_patience: 0
      seed: 20260902
    expect: {step: 20000, model_name: hybrid_anc_tiny, total_steps: 100000}
    post_eval:
      - {ckpt: best, n_items: 32, out: eval_pilot_best}
      - {ckpt: last, n_items: 32, out: eval_pilot_last}
    on_failure: continue

  - id: seed_repeat_tiny_long_20k
    kind: train
    tier: B
    compare: true
    reason: "유일하게 대조군과 대등했던 후보의 seed 반복"
    config: configs/train_pretrain.yaml
    model_config: configs/model_tiny_long.yaml
    ckpt_dir: runs/seed_repeat_tiny_long
    overrides:
      batch_size: 128
      num_workers: 14
      prefetch_factor: 4
      schedule.total_steps: 100000
      schedule.warmup_steps: 1250
      run_until_step: 20000
      eval_every: 500
      early_stop_patience: 0
      seed: 20260902
    expect: {step: 20000, model_name: hybrid_anc_tiny_long, total_steps: 100000}
    post_eval:
      - {ckpt: best, n_items: 32, out: eval_pilot_best}
      - {ckpt: last, n_items: 32, out: eval_pilot_last}
    on_failure: continue

  # 다른 seed 에서도 같은 결론이 나오는지 — 재현되면 "tiny 로 충분하다"가 확정된다.
  - id: decide_seed_repeat
    kind: decision
    tier: B
    reason: "seed 20260902 에서 tiny_long 이 대조군을 이기는지 재현 검사"
    depends_on: [seed_repeat_control_20k, seed_repeat_tiny_long_20k]
    decision:
      control:
        {name: tiny_control_seed2, run_dir: runs/seed_repeat_tiny_control,
         model_config: configs/model_tiny.yaml}
      candidates:
        - {name: tiny_long_seed2, run_dir: runs/seed_repeat_tiny_long,
           model_config: configs/model_tiny_long.yaml}
      primary_eval: eval_pilot_last
      confirm_eval: eval_pilot_best
      margin_db: 0.30
      worsening_tolerance_db: 1.0
    on_failure: continue
