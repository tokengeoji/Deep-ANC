# tiny_wide 사전학습 — **용량 가설 검증**.
#
# tiny 파인튜닝(50k)에서 학습 NMSE 가 step 10,000 이후 −2 dB 에서 정체했다. train 과
# val 의 격차가 2 dB 뿐이라 과적합(데이터 부족)이 아니라 **미적합(용량 부족)** 신호다.
# docs/12 §5.2 의 판별표가 이 경우 tiny_wide 를 지시한다.
#
# tiny 와 **깊이는 같고 폭만 4배**다(블록 8개 유지, C 128→512). GPU 는 폭에 거의 공짜지만
# 깊이에는 비싸다 — MAXN 실측 P50: tiny 0.29ms / tiny_wide 0.61ms / base(블록 15) 0.72ms.
#
# 다른 하이퍼파라미터는 train_pretrain.yaml 그대로 둔다. 바꾸면 tiny 와의 비교가 깨진다.

# Stage-1 사전학습 (open-loop, 시뮬레이션 데이터) — Elice A100 기준
# 실행: .venv/bin/python scripts/train/train.py --config configs/train_pretrain.yaml
# DDP:  .venv/bin/torchrun --nproc_per_node=2 scripts/train/train.py --config configs/train_pretrain.yaml

stage: open_loop                # open_loop | closed_loop
model_config: configs/model_tiny_wide.yaml
data_config: configs/data_sim.yaml
duct_config: configs/duct.yaml

batch_size: 96                  # A100 80GB — base 와 같은 sample budget 유지(비교 가능성)
num_workers: 14                # 2모델 동시 실행 시 32 vCPU 중 모델별 14개
prefetch_factor: 4

optimizer:
  name: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

schedule:
  warmup_steps: 1250           # 96×1250 = 기존 24×5000 warmup sample 수
  total_steps: 100000          # 96×100k = 기존 24×400k 총 sample 수
  min_lr: 1.0e-5

amp: bf16
grad_clip: 5.0

loss:
  # 실측 S(z) 신뢰대역 ∩ duct 목표대역 NMSE를 최소화.
  # fullband NMSE는 do-no-harm 관측 지표로 별도 기록한다.
  nmse_objective: trusted_band

  # --- 절대목표 2: 최악값 집계 ---
  # dB 산술평균의 아이템별 그래디언트는 잔차 RMS 에 **반비례**한다 (실측 log-log
  # 기울기 -0.94(synth)/-1.02(recorded), corr -0.99). 최악 4개가 그래디언트의 3.4%,
  # 최상 4개가 16.0% 였다 — 최악값 문제에 정확히 반대 방향이다.
  # q=0.25 근거: 평가 G4 는 worst10(=CVaR@10%)을 본다 → 학습은 그보다 약간 넓게 잡아
  # 게이트를 독립 검증으로 남긴다. 실패 질량 실측: synth val 96개 중 하위 25% 가
  # >= -0.03 dB, recorded 는 50% 가 >= -0.1 dB. q=0.10 은 과집중, q=0.50 은 평균 회귀.
  nmse_cvar_q: 0.25
  nmse_cvar_alpha: 0.7          # 순수 CVaR 은 유효 배치를 1/4 로 줄인다
  nmse_cvar_min_k: 4            # B=16 에서도 k>=4 보장

  # --- 절대목표 1: 대역 밖 악화 금지 (단측, S 위상 무관) ---
  # 대역 목록을 여기 적지 않는다. 신뢰 대역(개선 요구 대역)을 경계에서 빼서 만든다 —
  # S npz 의 consistency_band 가 넓어져도 따라오고, 겹침이 구조적으로 불가능하다.
  # 이전 합성/실측 대표 출력에서 사용하던 0.12는 폐기된 legacy 값이다.
  # 현행 strict-S fixture를 다시 측정한 결과 λ=0.00025의 비중은 0.088로
  # 하한에 못 미쳤고, λ=0.00075에서 0.264(목표 0.2~0.4)가 되었다.
  # 원시 측정·선형 재교정은 campaign ledger에 남긴다.
  #   2026-08-06: do-no-harm 마진이 +6.0 에서 게이트 유도값 -18.27 dB 로 24 dB 조여지면서
  #   힌지가 훨씬 자주 활성화됐다. 같은 λ=0.12 의 예산 몫이 **41.8** 이 되어 목적함수를
  #   42배로 덮는다(실측 S(z) 기준. 실제 체크포인트 출력으로도 47.3 으로 일치).
  #   tests/test_loss_gradient_budget.py 가 이 값을 걸어 두므로 λ 가 예산 밖으로
  #   흘러가면 학습 전에 실패한다.
  #   ⚠ 미검증: 이 항은 **제약**이지 목적항이 아니므로, "예산 0.2~0.4" 라는 규칙 자체가
  #   제약에 맞는지는 20k step ablation 으로 확인해야 한다 (엘리스에서).
  lambda_dnh: 0.00075
  # dnh_margin_db 는 **적지 않는다** — G4 게이트 임계(1.0 dB)에서 유도된다(-18.27 dB).
  #   2026-08-06 실측: 여기 적혀 있던 +6.0 을 정확히 만족한 모델이 게이트를 8.5 dB
  #   차이로 FAIL 했다(4000 Hz 옥타브 -9.53 dB). 손실과 게이트가 서로를 모르고 각자
  #   숫자를 들고 있었다. 유도는 src/deep_anc/dsp/do_no_harm.py 한 곳이고, 여기에 값을
  #   되쓰면 LossConfig 가 거부한다.
  dnh_weight_below: 1.0         # 신뢰대역 아래 (서브소닉 실측 최악 +30.5 dB)
  dnh_weight_above: 2.0         # 신뢰대역 위 (결함 3 진원지, 1633-6000Hz 최악 +19.9 dB)

  # --- 시간 국소성 ---
  # 1.5초 한 FFT 로는 최악 아이템이 +0.00 dB 인데 같은 배치를 0.125초 프레임으로 보면
  # 최악 프레임이 +10.82 dB, 증폭 프레임 12.2% 다. 8192 = 48kHz 에서 170 ms.
  lambda_frame: 0.5
  nmse_frame_samples: 8192
  nmse_frame_silence_db: -40.0  # 무음 프레임이 CVaR 을 먹는 것을 막는다

  # --- 스펙트럼 형상 (신뢰 대역 한정) ---
  mrstft_ffts: [256, 512, 1024, 2048]
  lambda_mrstft: 1.0
  # curriculum_a 는 신뢰 대역 **밖**에도 양측 가중을 준다 = "S(z) 를 못 믿는 곳에서
  # 상쇄하라". 대역 밖 압력은 전부 단측 do-no-harm 힌지가 담당해야 한다.
  band_weight: trusted_only     # curriculum_a | fullband | trusted_only

  # --- 출력 제약 ---
  # lambda_pow / lambda_clip 은 구조적으로 죽어 있었다: 모델이 y = L*tanh(u/L) 라
  # relu(|y|-0.18)^2 의 상한이 4.0e-4 로 고정이고 실측 그래디언트 기여가 1.1e-8 이다.
  # 1% 기여에 lambda_pow ~ 4.3e3 이 필요했다(설정값 1e-3 대비 6.4 오더).
  lambda_pow: 0.0               # 지표로만 남긴다. 대역밖 억제는 힌지가 표적 수행
  lambda_sat: 1.0               # 리미터 **이전** 활성 포화 벌점 (구 lambda_clip 대체)
  sat_margin: 2.0               # tanh'(2)=0.071 — 여기서부터 유효 그래디언트 1/14 이하

# CVaR 은 분위 추정이다. val 16개면 q=0.25 가 top-4 뿐이라 추정이 흔들린다.
# val 배치는 그래디언트가 없으므로 batch_size 와 무관하게 키울 수 있다.
val_items: 64
# loss_start_sample: 미지정 시 S 벌크지연 + handoff + FIR 탭수에서 자동 유도된다
#   (단일 출처: dsp/timing.py PlantSettle). 평가기 warmup 도 같은 값을 하한으로 쓴다.
eval_every: 500                # 96×500 = 기존 24×2000 eval 간격
log_every: 100
early_stop_patience: 0          # 고정 val 이 약하므로 corrected pretrain은 완주
ckpt_dir: runs/pretrain_tiny_wide
resume: null                    # 재개 시 ckpt 경로
seed: 20260802
