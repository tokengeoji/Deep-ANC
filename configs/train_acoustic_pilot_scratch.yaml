# Acoustic-reference 파일럿 (from-scratch) — 2026-09-03
#
# "레퍼런스 마이크로 실제 acoustic 신호를 받았을 때, 기존 digital-reference
# checkpoint를 파인튜닝하는 쪽과 처음부터 acoustic 로 새로 학습하는 쪽 중 뭐가
# 나은가"를 실측 전에 가장 빠르게 가늠하기 위한 비교 pilot의 from-scratch 쪽이다.
# 짝 config: configs/train_acoustic_pilot_finetune.yaml — init_ckpt/lr/warmup만 다르고
# 나머지(seed·data·loss·step 예산)는 동일해, 두 실행의 유일한 독립변수가
# "무엇으로 초기화했는가"가 되도록 맞췄다.
#
# 100% RIR-bank 시뮬레이션(data/rir_bank/duct_rirs_v1.npz 의 p_ref/f_fb/p_err)만
# 쓴다 — 실측 acoustic P/S나 acoustic-reference 녹음 데이터가 없어도 지금 바로
# 실행할 수 있다(로컬 synthetic-only 배선 확인 완료, 2026-09-03). 이 pilot의 val
# 숫자는 canonical 성능 근거가 아니다 — 승자를 골라 실제 덕트에서
# scripts/demo/evaluate_session.py 로 다시 실측해야 한다(오늘 measured
# multitone_stage1/nonlinear_stage1 시나리오와 같은 방식, configs/runtime_tiny_mic_diagnostic.yaml).
#
# 실행(Elice, GPU 필요): .venv/bin/python scripts/train/train.py \
#   --config configs/train_acoustic_pilot_scratch.yaml
stage: open_loop
experiment_role: performance_pilot
init_eligible: false
model_config: configs/model_tiny.yaml
data_config: configs/data_sim_acoustic_pilot.yaml
duct_config: configs/duct.yaml

batch_size: 96
num_workers: 14
prefetch_factor: 4

optimizer:
  name: adamw
  # 2026-09-04: 원래 1.0e-3에서 warmup(200 step) 정점에 도달하자마자 y가
  # 정확히 0으로 붕괴(loss 2.000/nmse 0.00dB 고정)하는 것을 로컬 계측
  # 스모크런(y_abs_mean 매 20 step 출력)으로 직접 확인 — 10배 낮추니 같은
  # 구간을 안정적으로 통과하고 nmse가 계속 개선됨(9.42→4.32dB, step 400).
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

schedule:
  warmup_steps: 200
  total_steps: 8000
  min_lr: 1.0e-5

amp: bf16
grad_clip: 5.0

loss:
  # 사용자가 이미 확정한 현행 목표(150-1600Hz 4개 subband 균등 개선, 1.6kHz 초과는
  # do-no-harm만)와 같은 목적함수 — configs/train_pretrain_tiny_balanced.yaml 과 동일.
  nmse_objective: equal_subband
  nmse_subband_guard_alpha: 0.25
  nmse_cvar_q: 0.25
  nmse_cvar_alpha: 0.7
  nmse_cvar_min_k: 4
  lambda_dnh: 0.00075
  dnh_weight_below: 1.0
  dnh_weight_above: 2.0
  lambda_frame: 0.0
  nmse_frame_samples: 8192
  nmse_frame_silence_db: -40.0
  mrstft_ffts: [256, 512, 1024, 2048]
  lambda_mrstft: 1.0
  band_weight: trusted_only
  lambda_pow: 0.0
  lambda_sat: 1.0
  sat_margin: 2.0

val_items: 64
eval_every: 500
log_every: 100
early_stop_patience: 0
required_world_size: 1
contract_run_dir: false
run_until_step: 8000
ckpt_dir: runs/acoustic_pilot_scratch
init_ckpt: null
resume: null
seed: 20260903
