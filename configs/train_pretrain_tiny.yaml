# canonical tiny 사전학습. train_pretrain.yaml과 모델/출력 경로 외 학습 계약이 같다.
# 파일럿/구형 [150,600] run과 섞이지 않도록 전용 신규 ckpt_dir을 쓴다.

stage: open_loop
experiment_role: canonical_pretrain
canonical_trust_policy: canonical_pretrain_v1
init_eligible: true
model_config: configs/model_tiny.yaml
data_config: configs/data_sim.yaml
duct_config: configs/duct.yaml

batch_size: 96
num_workers: 14
prefetch_factor: 4

optimizer:
  name: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

schedule:
  warmup_steps: 1250
  total_steps: 100000
  min_lr: 1.0e-5

amp: bf16
grad_clip: 5.0

loss:
  nmse_objective: trusted_band
  nmse_cvar_q: 0.25
  nmse_cvar_alpha: 0.7
  nmse_cvar_min_k: 4
  # 시작값일 뿐 canonical 승인값이 아니다. 각 alpha의 fresh G0가 NMSE<-6 dB를
  # 통과한 뒤 같은 checkpoint/batch의 strict-S output-y gradient share 0.2–0.4를
  # 통과한 λ만 그 candidate identity로 사용할 수 있다.
  lambda_dnh: 0.00075
  dnh_weight_below: 1.0
  dnh_weight_above: 2.0
  # frame metric은 유지하지만 signed frame-CVaR는 λ=0.5/0.2 모두 영출력 붕괴를
  # 재현했다. canonical v1은 DNH를 유지한 frame-metric-only 계약으로 시작한다.
  lambda_frame: 0.0
  nmse_frame_samples: 8192
  nmse_frame_silence_db: -40.0
  mrstft_ffts: [256, 512, 1024, 2048]
  lambda_mrstft: 1.0
  band_weight: trusted_only
  lambda_pow: 0.0
  lambda_sat: 1.0
  sat_margin: 2.0

val_items: 64
eval_every: 500
log_every: 100
early_stop_patience: 0
# canonical A100 1장 경로. DDP checkpoint는 아직 rank별 stochastic state를
# 저장하지 않으므로 이 공식 실험에서 멀티 GPU를 조용히 허용하지 않는다.
required_world_size: 1
contract_run_dir: true
# Elice bootstrap 직후 외부 SHA와 함께 주입해야 하는 trust anchors. null인
# 저장소 기본값은 공식 run stamp 이전에 fail-closed한다.
campaign_prerequisite: results/training_prerequisites/canonical_pretrain.json
campaign_prerequisite_sha256: null
# seed=20260903은 primary loss-selection evidence를 다시 발행하지 않는다. primary
# borderline selection과 seed-specific A100 resume smoke를 함께 봉인한 별도
# no-replace prerequisite가 있을 때만 canonical pretrain admission이 열린다.
# seed=20260803 및 모든 derivative/smoke에서는 두 값이 반드시 null이다.
second_seed_prerequisite: null
second_seed_prerequisite_sha256: null
ckpt_dir: runs
resume: null
seed: 20260803

# pilot은 frame-metric-only(lambda_frame=0)로 고정하고 alpha∈{0.7,1.0}를 비교한다.
# 각 20k pilot best.pt에서 별도 5k measured 70:30 probe를 실행한다. 두
# measured-probe recorded-val 점수 차이가 0.2dB 이내일 때만 alpha=0.85의
# 20k+5k chain을 추가한다. alpha=1.0 non-finite/실행 실패는
# 재현 가능한 immutable failure receipt가 생기기 전까지 0.85 fallback의 근거가 아니며
# canonical을 막는다. signed frame-CVaR 0.5/0.2는 fixed-batch control에서 영출력 붕괴를
# 재현해 승인 후보가 아니다.
# 각 후보는 100k schedule을 바꾸지 않고
# `--set experiment_role=loss_pilot --set init_eligible=false \
# --set run_until_step=20000`으로 같은 초반 곡선을 비교한다. role과 두 loss
# 값은 contract SHA/run dir에 포함되고, run_until은 같은 run의 재개를 위해 제외된다.
#
# 각 20k 후보의 실측 P 5k probe는 새 contract run으로 실행한다:
#   --set experiment_role=measured_probe --set init_eligible=false \
#   --set data.digital_primary_path_mode=measured --set run_until_step=5000 \
#   --set init_ckpt=<same-alpha-20k-best.pt>
# measured_probe role은 설정 로더에서 아래 항목을 원자적으로 물질화하며 상충 override를
# 즉시 거부한다: canonical recorded_regrouped.jsonl, recorded_ratio=0.7(실측 70% +
# synthetic 30%), require_recorded_manifest=true, require_measured_primary_path=true,
# same-alpha loss_pilot best.pt init 필수. 따라서 이 단계는 synthetic-only probe가
# 아니라 짧은 measured fine-tune이다. 최종 alpha와 0.2dB/0.85 판정은
# 후보별 measured-probe recorded val만 보고 test는 열지 않는다.
