# legacy diagnostic runtime 설정 (Jetson)
# 현재 Base checkpoint는 strict P/S=115와 맞지 않는 lead=109 artifact다. 실제
# sounddevice/engine 시작 전 strict plant 계약에서 거부되어야 하며, canonical fine-tune
# 배포 설정은 완료한 모델 artifact를 받은 뒤 별도로 만든다.

hardware_config: configs/hardware_jetson.yaml
duct_config: configs/duct.yaml

hop: 256                        # 엔진 스텝 샘플 수 = 콜백 블록. 모델(hop 128)은 그래프 내부 2프레임 언롤
reference: digital              # digital | mic  (ch1 레퍼런스 마이크 수리 확인 전 digital 기본)
controller: dl                  # dl | fxlms

# 소음 ch0 재생을 지연시켜 모델에 자기생성 소스를 이만큼 먼저 제공한다.
# checkpoint/ONNX 메타와 다르면 오디오 시작 전에 거부한다(메타 없는 legacy artifact=0).
# acoustic reference(reference: mic)에서는 반드시 0 이다 — lead 는 digital-ref 전용
# 자유변수라 음향 레퍼런스로 전이되지 않는다.
#
# 2026-08-06 수정: 이전 값은 0 이었고 주석은 "corrected checkpoint 를 배포할 때 109 로
# 바꾼다"였다. 그런데 아래 engine.ckpt 는 **이미** corrected checkpoint
# (runs/pretrain_base_corrected/ckpt/best.pt, 메타 lead=109)를 가리키고 있었다.
# 즉 이 설정은 자기 모순이었고 실제로 시작하지 못했다:
#   validate_digital_reference_lead('digital', 0, 109)
#     → ValueError: digital-reference lead 불일치: runtime=0, checkpoint=109
# 실패-폐쇄라 사고는 없었지만, "기본 설정이 시작 자체를 못 한다"는 것은 아무도 이
# 경로를 켜 본 적이 없다는 뜻이다.
#
# ⚠ 109 는 checkpoint 와의 정합값일 뿐 현재 strict 플랜트값이 아니다. strict lead는
#   S.delay 1245 + handoff 256 − P.delay 1386 = 115다. 숫자만 바꾸는 것은 weight
#   timing을 바꾸지 않으므로 금지한다. 자세한 근거는 configs/runtime_tiny.yaml을 보라.
digital_reference_lead_samples: 109

engine:
  type: torch                   # torch | ort | trt  (개발→검증→배포 순 마이그레이션)
  ckpt: runs/pretrain_base_corrected/ckpt/best.pt  # torch 엔진용 (모델 구조는 ckpt 내장 cfg 사용)
  # 2026-08-05: `onnx: runs/export/model.onnx` 와 `plan: runs/export/model_fp16.plan`
  # 두 줄을 지웠다. **둘 다 존재한 적이 없는 파일**이다. engine.type=torch 라 읽히지
  # 않아 아무도 몰랐고, ort/trt 로 바꾸는 순간 터졌을 것이다.
  #
  # 없는 경로를 "나중에 채울 자리"로 남겨 두면 설정이 권위 있어 보이면서 아무 효과가
  # 없다 — 정확히 이런 것이 다음 사람을 속인다. 실제로 내보낸 아티팩트를 쓰려면
  # configs/runtime_tiny.yaml 을 보라(tiny_corrected.onnx / tiny_corrected_fp16.plan).
  # 여기에 다시 적을 때는 파일을 먼저 만들 것 — preflight 가 시작 전에 거부한다.
  cpu_affinity: [4, 5, 6, 7]    # 추론 스레드 CPU 소프트 고정

# S(z) npz 는 duct.yaml secondary_path.npz 가 단일 출처 (여기 중복 정의 금지 — 감사 M9)

fxlms:                          # controller=fxlms 또는 DL 폴백용
  control_length: 256
  mu: 0.05
  leakage: 1.0e-6
  weight_norm_limit: 20.0

safety:
  # 2026-08-06: clip_streak_mute / deadline_miss_mute 를 지웠다. 둘 다 **스트릭**이라
  # (a) 클립 스트릭은 DL 경로에서 리미터와 같은 값을 재 구조적으로 항상 0 이었고
  # (b) 데드라인 스트릭은 교대 미스(1,0,1,0)에서 매 블록 리셋돼 영원히 발동하지 않았다.
  # 남겨 두면 SafetyLimits 가 "쓰이지 않는 키" 안내를 남긴다(조용히 무시하지 않는다).
  # 아래 키는 전부 SafetyLimits 가 생성 시점에 범위 검증한다 — 오타는 거부된다.
  control_limit: 0.2            # 상쇄 출력 피크 제한 (모델 소프트 리미터와 같은 값)
  fade_ms: 20

  saturation_ratio: 0.95        # |y| > 0.95×limit 인 샘플을 포화로 센다 (리미터와 다른 값)
  saturation_fraction: 0.5      # 블록의 이 비율이 포화면 그 블록을 포화로 판정
  saturation_window_s: 1.0
  saturation_rate_mute: 0.5     # 최근 1초의 포화 블록 비율이 넘으면 mute

  output_rms_ratio: 0.6         # rms > 0.6×limit 이면 과출력 블록
  rms_window_s: 1.0
  rms_rate_mute: 0.5

  deadline_window_s: 1.0        # 슬라이딩 윈도 미스율 (스트릭 아님)
  deadline_miss_rate_mute: 0.2

  divergence_ratio: 4.0         # 에러파워가 베이스라인 ×4 (+6dB) 이고
  divergence_hold_s: 0.5        #   0.5초 지속되면 → 발산 "의심"
  divergence_rate_mute: 0.5
  baseline_floor_power: 1.0e-8  # 이보다 작으면 "잰 것이 없다" (fail-closed)
  baseline_tau_s: 1.0           # 상쇄 출력이 닫힌 구간의 에러 파워 EMA 시정수
  baseline_grace_s: 3.0         # 유효 베이스라인 없이 ANC 를 켜 둘 수 있는 시간
  # 의심 → 즉시 상쇄 출력을 닫고(=mute 와 음향적으로 동일) 아래 시간 동안 ANC 없는
  # 에러 파워를 다시 잰다. 떨어지면 발산 확정 mute, 그대로면 "방이 시끄러워진 것"이므로
  # 베이스라인을 갱신하고 재개한다. 마이크 하나로는 그 둘을 추측으로 못 가른다.
  divergence_probe_s: 1.0
  divergence_probe_confirm_ratio: 2.0   # (1, divergence_ratio) 여야 한다
  divergence_probe_limit: 3     # 연속 미결 프로브 상한 → 넘으면 fail-closed mute
  divergence_probe_clear_s: 10.0

  output_dc_limit_ratio: 0.05   # |DC| > 0.05×limit 가 지속되면 mute (보이스코일 보호)
  output_dc_window_s: 0.2
  output_dc_rate_mute: 0.5
  output_dc_blocker_r: 0.9995   # 출력 DC 차단기 극점 (f_c ≈ 3.8 Hz @48k)
  # DC 판정량은 이동평균이 아니다 — 53 ms 이동평균은 80 Hz 영평균 상쇄음을 DC 로
  # 오인했다(실측: 80Hz/0.18 → 12블록에 mute). 80 Hz 는 목표 대역 안이다.
  output_dc_lowpass_hz: 2.0     # 블록률에서 도는 1차 저역통과 (80Hz 이득 0.034)
  output_dc_ac_dominance: 0.3   # DC 추정값이 AC 대비 이만큼은 되어야 DC 로 센다
  output_dc_hard_ratio: 0.5     # |DC| > 0.5×limit 이면 AC 와 무관하게 센다

  handoff_window_s: 1.0
  handoff_drop_rate_mute: 0.2   # 오래된 입력을 버린 블록 비율 (실효 핸드오프 이탈)

noise:                          # ch0 소음 스피커 프로그램
  type: tone                    # tone | multitone | white | band | nonlinear | file
  frequency: 300.0
  amplitude: 0.05
  band: [80.0, 1000.0]
  file: null
  seed: 20260801

record: null                    # 세션 녹음 저장 경로 (예: results/demo_0803)
run_seconds: 0.0                # 0 = Q 키까지 실행
start_on: false                 # 안전 불변식: true는 런타임이 거부하며 항상 ANC OFF로 시작
